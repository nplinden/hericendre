[project]
name = "hericendre"
version = "0.1.0"
description = "A radioactive decay and fuel depletion code"
readme = "README.md"
authors = [{ name = "Nicolas Linden", email = "nicolas@nlinden.com" }]
requires-python = ">=3.11"
dependencies = [
    "h5py>=3.13.0",
    "numpy>=2.2.4",
    "pint>=0.24.4",
    "polars>=1.26.0",
]

[build-system]
requires = ["scikit-build-core>=0.10"]
build-backend = "scikit_build_core.build"

[tool.scikit-build]
minimum-version = "build-system.requires"

[tool.cibuildwheel]
build = "cp3{11,12,13}-*"
skip = ["*-win32", "*-manylinux_i686", "*-musllinux_*", "pp*"]
build-verbosity = 1
test-command = "python -c 'import hericendre; print(hericendre.__file__)'"
test-requires = ["pytest"]

[tool.cibuildwheel.linux]
before-all = ["yum install -y zlib-devel hdf5-devel"]
environment = { CMAKE_BUILD_PARALLEL_LEVEL = "4" }

[dependency-groups]
dev = ["cibuildwheel>=3.3.0"]
